[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "serpsmith"
version = "0.8.0b1"
description = "Durable Hermes-first blog publishing engine"
requires-python = ">=3.11"
dependencies = ["Pillow>=10", "httpx>=0.27", "google-auth[requests]>=2.29"]

[project.scripts]
serpsmith = "serpsmith.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
serpsmith = ["faq_motion.js"]
